<div class="random-cat-container" style="text-align: center;">
  <img 
    id="dynamic-cat-img" 
    src="https://cataas.com/cat" 
    alt="Random Cat" 
    style="max-width: 300px; width: 100%; height: auto; border-radius: 8px;" 
  />
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var img = document.getElementById("dynamic-cat-img");
    if (img) {
      // Append timestamp to bypass browser cache on every visit
      img.src = "https://cataas.com/cat?" + new Date().getTime();
    }
  });
</script>
